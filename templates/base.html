<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
        }

        h1, h2, h3 {
            color: #222;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .flash {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }

        .flash.success {
            background: #e8f5e9;
            color: #256029;
        }

        .flash.error {
            background: #ffebee;
            color: #8a1c1c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        .low-stock {
            color: #c62828;
            font-weight: bold;
        }

        button, .btn {
            background: #333;
            color: white;
            border: none;
            padding: 7px 12px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        button:hover, .btn:hover {
            background: #555;
        }

        .btn-danger {
            background: #b3261e;
        }

        .btn-danger:hover {
            background: #8f1d18;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 7px;
            border: 1px solid #bbb;
            box-sizing: border-box;
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .full-button {
            width: 100%;
        }

        .register-button {
            background: #2e7d32;
        }

        .register-button:hover {
            background: #256628;
        }

        .inline-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .quantity-input {
            width: 60px;
        }

        .small-input {
            width: 80px;
        }

        .add-product {
            background: #f7f7f7;
            padding: 15px;
            border: 1px solid #ccc;
            margin-bottom: 25px;
        }

        .product-form {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .product-name {
            margin: 0;
            flex: 2;
        }

        .product-field {
            margin: 0;
            flex: 1;
        }

        .split-screen {
            display: flex;
            gap: 20px;
        }

        .half {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
        }

        @media (max-width: 700px) {
            .page-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .full-button {
            width: 100%;
        }

        .register-button {
            background: #2e7d32;
        }

        .register-button:hover {
            background: #256628;
        }

        .inline-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .quantity-input {
            width: 60px;
        }

        .small-input {
            width: 80px;
        }

        .add-product {
            background: #f7f7f7;
            padding: 15px;
            border: 1px solid #ccc;
            margin-bottom: 25px;
        }

        .product-form {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .product-name {
            margin: 0;
            flex: 2;
        }

        .product-field {
            margin: 0;
            flex: 1;
        }

        .split-screen {
                display: block;
            }

            .half {
                margin-bottom: 15px;
            }

            .product-form {
                display: block;
            }

            .product-name,
            .product-field {
                margin-bottom: 12px;
            }

            .inline-form {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
